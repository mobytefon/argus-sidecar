# Standalone sidecar, for a Caddy that is not MOBI-WAF. MOBI-WAF runs the
# sidecar itself (its docker-compose.argus.yml): do not run this stack next
# to it.
services:
  argus-sidecar:
    image: ghcr.io/mobytefon/argus-sidecar:v0.2.1
    build: .
    restart: unless-stopped
    # Must be able to open the socket Caddy connects to: the image user
    # 10000:10000 (with Caddy as 10000 or root), or 0:0 under rootless Docker,
    # where it is the host user and reads a model directory in its home.
    user: "${ARGUS_USER:-10000:10000}"
    # The service only talks over the Unix socket in the shared volume.
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      # The container mount stays /model; ARGUS_MODEL_DIR_HOST selects the host bundle.
      ARGUS_MODEL_DIR: /model
      ARGUS_SOCKET: ${ARGUS_SOCKET:-/run/argus/argus.sock}
      ARGUS_SOCKET_MODE: "${ARGUS_SOCKET_MODE:-0o660}"
      ARGUS_THRESHOLD: ${ARGUS_THRESHOLD:-fpr0.1%}
      ARGUS_WORKERS: ${ARGUS_WORKERS:-4}
      ARGUS_MAX_CONCURRENT_RPCS: ${ARGUS_MAX_CONCURRENT_RPCS:-16}
      ARGUS_RELOAD_INTERVAL_S: ${ARGUS_RELOAD_INTERVAL_S:-5}
      ARGUS_MIN_REMAINING_MS: ${ARGUS_MIN_REMAINING_MS:-5}
      ORT_INTRA_THREADS: ${ORT_INTRA_THREADS:-1}
      LOG_LEVEL: ${ARGUS_LOG_LEVEL:-INFO}
    volumes:
      # Read-only; copying new files over the host directory hot-reloads the model.
      - ${ARGUS_MODEL_DIR_HOST:?Set ARGUS_MODEL_DIR_HOST to the model directory}:/model:ro
      - argus-run:/run/argus
    cpus: ${ARGUS_CPUS:-2}
    mem_limit: ${ARGUS_MEM_LIMIT:-512m}
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  argus-run:
    name: ${ARGUS_SOCKET_VOLUME:-argus-run}
